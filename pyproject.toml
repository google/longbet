[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "longbet-jax"
version = "0.10.0"
description = "Bayesian causal forests for longitudinal experiments and panel data (LongBet, Rank-K exposure-basis BCF) in JAX"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Ignacio Martinez" }
]
dependencies = [
    "bartz==0.12.1",
    "jax>=0.6.2",
    "equinox>=0.13.0",
    "jaxtyping>=0.3.2",
    "numpy>=2.0",
    "scipy>=1.15.0",
    "arviz>=1.3.0",
    "polars>=1.0.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    # The default ("plug-in") variant of fit_rank_k_longbet fits stochtree BCFs.
    "stochtree>=0.4.5",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.6.2"]
cuda13 = ["jax[cuda13]>=0.6.2"]
# Kept empty for backward compatibility: stochtree is a core dependency since 0.5.0.
rank-k = []
plot = ["matplotlib>=3.8"]
dev = [
    "pytest>=8.0.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "stochtree>=0.4.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/longbet"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: statistical tests that need long chains (Geweke, coverage, recovery)",
]
